<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letterforge — 3D printable letters</title>
    <meta name="description" content="Type a word and turn it into a 3D-printable sign, planter, topographic or faceted letter. Download STL or multi-colour 3MF. Runs entirely in your browser." />
    <meta name="theme-color" content="#f4f1ea" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 4h8v18h12v6H6z" fill="#1f7a5c"/><path d="M6 4l4 4v14l-4 6M14 4l-4 4M26 22l-4 3M26 28l-4-3H10M10 22h12" fill="none" stroke="#f4f1ea" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <div>
            <h1>Letterforge</h1>
            <p>Words → 3D-printable objects</p>
          </div>
        </header>

        <section>
          <h2>Text</h2>
          <label class="sub" id="text-label" for="text" hidden>Main text</label>
          <textarea id="text" rows="2" spellcheck="false" aria-label="Text to make"></textarea>
          <div id="fonts" class="fonts"></div>
          <label class="upload"><input id="font-upload" type="file" accept=".ttf,.otf,.woff,.woff2" />Upload your own font (TTF, OTF, WOFF)</label>
          <div id="text2-wrap" class="text2" hidden>
            <label class="sub" for="text2">Accent text</label>
            <input id="text2" type="text" spellcheck="false" placeholder="e.g. Happy (leave empty for none)" />
            <label class="sub" for="font2">Accent font</label>
            <select id="font2"></select>
          </div>
        </section>

        <section>
          <h2>Style</h2>
          <div id="styles" class="styles"></div>
          <p id="style-blurb" class="blurb"></p>
        </section>

        <section>
          <h2>Size</h2>
          <div id="general-controls"></div>
        </section>

        <section>
          <h2 id="style-title">Settings</h2>
          <div id="style-controls"></div>
        </section>

        <section>
          <h2>Colours</h2>
          <div class="colors">
            <label><input id="colorA" type="color" /><span id="colorA-label">A</span></label>
            <label id="colorB-wrap"><input id="colorB" type="color" /><span id="colorB-label">B</span></label>
          </div>
          <small class="note">The 3MF keeps every part separate, so your slicer can give each one its own filament.</small>
        </section>

        <section>
          <h2>Printer</h2>
          <div id="printer-controls"></div>
        </section>

        <footer class="foot">Everything runs in your browser — nothing is uploaded. Fonts are open-source (SIL OFL).</footer>
      </aside>

      <main class="stage">
        <div id="viewport" class="viewport"></div>
        <div class="hud top">
          <div id="dims" class="dims"></div>
          <div id="status" class="status"><span></span>Building…</div>
        </div>
        <div id="warnings" class="warnings"></div>
        <div id="drag-hint" class="drag-hint" hidden>Drag the text to move it</div>
        <ul id="parts" class="parts"></ul>
        <div class="actions">
          <button id="fit" class="ghost" type="button" title="Reset the camera">Fit view</button>
          <button id="dl-stl" class="secondary" type="button">Download STL</button>
          <button id="dl-3mf" class="primary" type="button">Download 3MF</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
